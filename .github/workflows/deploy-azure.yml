name: Deploy to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-app-service-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package Azure Node app
        shell: bash
        run: |
          mkdir -p publish/assets
          cp package.json server.js index.html styles.css app.js icon.svg manifest.webmanifest privacy.html admin.html admin.css admin-users.css auth-nav.css admin.js login.html login.css login.js portal.html portal.css portal.js setup.html setup.js publish/
          cp assets/worker-hero.jpg assets/company-building.jpg publish/assets/

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: c275acb8-a449-4a3f-abb6-7fa2b92cd04f
          tenant-id: ca9a8b8c-3ea3-4799-a43e-5510398e7a3b
          subscription-id: 673e191b-c929-489b-9843-81abef0b119e

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: formal-electrical-and-maintenace
          package: publish
